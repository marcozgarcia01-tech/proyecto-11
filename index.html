<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 11 - Cookie Consent</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- Contenido principal de ejemplo de la página -->
    <main class="contenido-principal">
        <h1>Bienvenido a mi sitio web</h1>
        <p>Al costado derecho inferior veremos las famosas cookies</p>
    </main>

    <!-- Banner de consentimiento de cookies -->
    <div id="cookie-banner" class="banner-cookies hidden">
        <div class="contenido-cookies">
            <button id="close-btn" class="boton-cerrar">&times;</button>
            <div class="icono-cookies">
                🍪
            </div>
            <p>Esta es la cookie que se necesita para el proyecto.</p>
            <button id="accept-btn" class="boton-aceptar">Aceptar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
